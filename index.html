<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Webpages Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-hover: rgba(30, 41, 59, 0.95);
      --border: #1e293b;
      --border-hover: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --add-btn-bg: rgba(56, 189, 248, 0.08);
      --add-btn-border: rgba(56, 189, 248, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 50% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1;
    }

    .list-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px 6px 4px;
    }

    .file-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .sync-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .sync-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .list-wrapper {
      width: 100%;
      max-height: 70vh;
      overflow-y: auto;
      padding-right: 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Custom Sleek Scrollbar */
    .list-wrapper::-webkit-scrollbar {
      width: 6px;
    }
    .list-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }
    .list-wrapper::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .list-wrapper::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Row Item */
    .row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      backdrop-filter: blur(12px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .row-item:hover {
      background: var(--card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
    }

    .file-icon {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .file-name {
      font-size: 0.95rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .row-arrow {
      flex-shrink: 0;
      color: var(--text-muted);
      margin-left: 12px;
      transition: transform 0.2s, color 0.2s;
    }

    .row-item:hover .row-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* Add New HTML Row Button */
    .add-row-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      background: var(--add-btn-bg);
      border: 1.5px dashed var(--add-btn-border);
      border-radius: 12px;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .add-row-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .add-row-btn svg {
      transition: transform 0.2s;
    }

    .add-row-btn:hover svg {
      transform: scale(1.15) rotate(90deg);
    }

    /* Drag and drop overlay */
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(8px);
      border: 3px dashed var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .drop-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Modal for Adding HTML */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .modal-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-input:focus {
      border-color: var(--accent);
    }

    .modal-divider {
      text-align: center;
      position: relative;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-divider::before, .modal-divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 38%;
      height: 1px;
      background: #334155;
    }
    .modal-divider::before { left: 0; }
    .modal-divider::after { right: 0; }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-upload-btn {
      width: 100%;
      padding: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, border-color 0.2s;
    }

    .file-upload-btn:hover {
      background: #334155;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-secondary {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
    }
    .btn-secondary:hover {
      background: #1e293b;
      color: #fff;
    }

    .btn-primary {
      padding: 8px 18px;
      background: #0284c7;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <!-- Drag & Drop Visual Indicator -->
  <div class="drop-overlay" id="drop-overlay">
    📂 Drop HTML file here to add
  </div>

  <div class="container">
    <div class="list-header-bar">
      <span class="file-count" id="file-count">Loading pages...</span>
      <button class="sync-btn" id="sync-dir-btn" title="Scan directory for new HTML files">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Scan Folder
      </button>
    </div>

    <!-- Scrollable Rows of HTML Files -->
    <div class="list-wrapper" id="html-list"></div>

    <!-- Add New HTML Option -->
    <div class="add-row-btn" id="open-modal-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Add New HTML</span>
    </div>
  </div>

  <!-- Hidden Inputs for File/Folder Selection -->
  <input type="file" id="file-picker" accept=".html,.htm" multiple style="display: none;">
  <input type="file" id="folder-picker" webkitdirectory directory style="display: none;">

  <!-- Modal for Adding New HTML -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <h3 class="modal-title">Add HTML Webpage</h3>
      <input type="text" class="modal-input" id="filename-input" placeholder="e.g. 7 Routing Fundamentals.html">
      
      <div class="modal-divider">or choose from device</div>

      <div class="btn-group">
        <button type="button" class="file-upload-btn" onclick="document.getElementById('file-picker').click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Select HTML File(s)
        </button>

        <button type="button" class="file-upload-btn" onclick="document.getElementById('folder-picker').click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          Scan Whole Folder
        </button>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="close-modal-btn">Cancel</button>
        <button type="button" class="btn-primary" id="save-html-btn">Add to List</button>
      </div>
    </div>
  </div>

  <script>
    // Built-in list of HTML files in directory
    const DEFAULT_FILES = [
      "2 Introducing Junos OS and the Hardware It Powers.html",
      "3 SSH and Operational Mode.html",
      "4 Refresher - IPv6 Addressing.html",
      "5 Network Interfaces, Part 1 - Interface Naming and Logical Units.html",
      "6 Network Interfaces, Part 2 - Revealing and Filtering Detailed Interface Output.html"
    ];

    const listWrapper = document.getElementById('html-list');
    const fileCountEl = document.getElementById('file-count');
    const modal = document.getElementById('modal');
    const openModalBtn = document.getElementById('open-modal-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const saveBtn = document.getElementById('save-html-btn');
    const filenameInput = document.getElementById('filename-input');
    const filePicker = document.getElementById('file-picker');
    const folderPicker = document.getElementById('folder-picker');
    const syncDirBtn = document.getElementById('sync-dir-btn');
    const dropOverlay = document.getElementById('drop-overlay');

    // Storage map: { [name]: url }
    function getAllPages() {
      const stored = JSON.parse(localStorage.getItem('discovered_html_pages') || '{}');
      // Merge defaults
      DEFAULT_FILES.forEach(filename => {
        if (!stored[filename]) {
          stored[filename] = filename;
        }
      });
      return stored;
    }

    function savePages(pagesMap) {
      localStorage.setItem('discovered_html_pages', JSON.stringify(pagesMap));
    }

    // Natural sort (e.g. 2, 3, 4, 5, 6, 10...)
    function sortFilenames(filenames) {
      return filenames.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
    }

    function renderList() {
      const pages = getAllPages();
      const filenames = sortFilenames(Object.keys(pages));
      
      listWrapper.innerHTML = '';
      fileCountEl.textContent = `${filenames.length} HTML document${filenames.length === 1 ? '' : 's'}`;

      filenames.forEach(name => {
        const url = pages[name];
        const a = document.createElement('a');
        a.href = url;
        a.className = 'row-item';
        a.innerHTML = `
          <div class="row-left">
            <div class="file-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
            </div>
            <span class="file-name">${name}</span>
          </div>
          <div class="row-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </div>
        `;
        listWrapper.appendChild(a);
      });
    }

    // Try scanning directory via HTTP fetch or Directory Listing
    async function autoProbeDirectory() {
      try {
        const res = await fetch('./');
        if (res.ok) {
          const text = await res.text();
          const doc = new DOMParser().parseFromString(text, 'text/html');
          const links = Array.from(doc.querySelectorAll('a'))
            .map(a => a.getAttribute('href'))
            .filter(href => href && (href.endsWith('.html') || href.endsWith('.htm')) && !href.includes('index.html'));

          if (links.length > 0) {
            const pages = getAllPages();
            links.forEach(href => {
              const decoded = decodeURIComponent(href.replace(/^\.\//, ''));
              pages[decoded] = decoded;
            });
            savePages(pages);
            renderList();
          }
        }
      } catch (e) {
        // file:// protocol fallback
      }
    }

    // Add file(s)
    function addFiles(fileList) {
      const pages = getAllPages();
      Array.from(fileList).forEach(file => {
        if (file.name.endsWith('.html') || file.name.endsWith('.htm')) {
          if (file.name.toLowerCase() !== 'index.html') {
            pages[file.name] = file.name;
          }
        }
      });
      savePages(pages);
      renderList();
    }

    // Native Directory Picker (if supported) or Folder Picker
    syncDirBtn.addEventListener('click', async () => {
      if ('showDirectoryPicker' in window) {
        try {
          const dirHandle = await window.showDirectoryPicker();
          const pages = getAllPages();
          for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file' && (entry.name.endsWith('.html') || entry.name.endsWith('.htm')) && entry.name.toLowerCase() !== 'index.html') {
              pages[entry.name] = entry.name;
            }
          }
          savePages(pages);
          renderList();
          return;
        } catch (err) {
          if (err.name !== 'AbortError') {
            folderPicker.click();
          }
        }
      } else {
        folderPicker.click();
      }
    });

    // File / Folder Inputs
    filePicker.addEventListener('change', (e) => {
      if (e.target.files.length) {
        addFiles(e.target.files);
        modal.classList.remove('active');
      }
    });

    folderPicker.addEventListener('change', (e) => {
      if (e.target.files.length) {
        addFiles(e.target.files);
        modal.classList.remove('active');
      }
    });

    // Manual filename input
    saveBtn.addEventListener('click', () => {
      const name = filenameInput.value.trim();
      if (name) {
        const pages = getAllPages();
        pages[name] = name;
        savePages(pages);
        renderList();
        modal.classList.remove('active');
      }
    });

    filenameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveBtn.click();
    });

    // Modal Triggers
    openModalBtn.addEventListener('click', () => {
      filenameInput.value = '';
      modal.classList.add('active');
      filenameInput.focus();
    });

    closeModalBtn.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    // Drag and Drop
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('active');
    });

    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) {
        dropOverlay.classList.remove('active');
      }
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      if (e.dataTransfer.files && e.dataTransfer.files.length) {
        addFiles(e.dataTransfer.files);
      }
    });

    // Refresh list on window focus
    window.addEventListener('focus', () => {
      autoProbeDirectory();
      renderList();
    });

    // Initial render & scan
    renderList();
    autoProbeDirectory();
  </script>

</body>
</html>
